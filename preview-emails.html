<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lets Prenup — Email Templates Previewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-heart {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #f43f5e 0%, #e28691 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 16px rgba(226, 134, 145, 0.4);
    }
    .brand-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .brand-title span { color: #e28691; }
    .badge-dev {
      background: rgba(226, 134, 145, 0.15);
      border: 1px solid rgba(226, 134, 145, 0.3);
      color: #e28691;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-view {
      background: #334155;
      color: #cbd5e1;
      border: 1px solid #475569;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-view.active, .btn-view:hover {
      background: #e28691;
      border-color: #e28691;
      color: #ffffff;
    }
    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .sidebar {
      width: 340px;
      background: #1e293b;
      border-right: 1px solid #334155;
      padding: 20px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .stage-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #94a3b8;
      margin: 16px 8px 6px;
    }
    .stage-title:first-child { margin-top: 0; }
    .nav-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 12px 14px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      color: #e2e8f0;
    }
    .nav-item:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: #334155;
    }
    .nav-item.active {
      background: rgba(226, 134, 145, 0.12);
      border-color: rgba(226, 134, 145, 0.4);
    }
    .nav-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-item-title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
    }
    .nav-item.active .nav-item-title {
      color: #e28691;
    }
    .recipient-tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .tag-mutual { background: #059669; color: #ecfdf5; }
    .tag-partner { background: #0284c7; color: #f0f9ff; }
    .tag-owner { background: #7c3aed; color: #faf5ff; }
    .tag-admin { background: #d97706; color: #fffbeb; }
    .nav-item-sub {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      background: #090d16;
      overflow-y: auto;
    }
    .meta-bar {
      width: 100%;
      max-width: 680px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px 20px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
    }
    .meta-row {
      display: flex;
      gap: 12px;
    }
    .meta-label {
      color: #94a3b8;
      width: 90px;
      font-weight: 600;
    }
    .meta-value {
      color: #f1f5f9;
      font-weight: 500;
    }
    .frame-wrapper {
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      transition: width 0.3s ease;
      width: 600px;
    }
    .frame-wrapper.mobile {
      width: 380px;
    }
    iframe {
      width: 100%;
      height: 750px;
      border: none;
      display: block;
      background: #f8fafc;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo-heart">💍</div>
    <div class="brand-title">Lets <span>Prenup</span></div>
    <span class="badge-dev">Templates Previewer</span>
  </div>
  <div class="controls">
    <span style="font-size:13px; color:#94a3b8; margin-right:8px;">View Mode:</span>
    <button class="btn-view active" onclick="setViewMode('desktop')">💻 Desktop (600px)</button>
    <button class="btn-view" onclick="setViewMode('mobile')">📱 Mobile (380px)</button>
  </div>
</header>

<div class="container">
  <!-- Sidebar Navigation -->
  <div class="sidebar">
    <div class="stage-title">Stage 1: Invite & Onboarding</div>
    <button class="nav-item active" onclick="loadEmail(0)">
      <div class="nav-item-header">
        <span class="nav-item-title">1. Partner Invitation</span>
        <span class="recipient-tag tag-partner">Partner (P2)</span>
      </div>
      <span class="nav-item-sub">Invite email with join link & wedding date</span>
    </button>
    <button class="nav-item" onclick="loadEmail(1)">
      <div class="nav-item-header">
        <span class="nav-item-title">2. Partner Joined Alert</span>
        <span class="recipient-tag tag-owner">Owner (P1)</span>
      </div>
      <span class="nav-item-sub">Alert when partner creates account</span>
    </button>

    <div class="stage-title">Stage 2: Forms Progress</div>
    <button class="nav-item" onclick="loadEmail(2)">
      <div class="nav-item-header">
        <span class="nav-item-title">3. Partner Reminder</span>
        <span class="recipient-tag tag-partner">Partner (P2)</span>
      </div>
      <span class="nav-item-sub">Friendly reminder to complete questionnaire</span>
    </button>

    <div class="stage-title">Stage 3: Review & Handshake</div>
    <button class="nav-item" onclick="loadEmail(3)">
      <div class="nav-item-header">
        <span class="nav-item-title">4. Handshake Review Request</span>
        <span class="recipient-tag tag-partner">Reviewer</span>
      </div>
      <span class="nav-item-sub">Submitter asks partner to review and approve</span>
    </button>
    <button class="nav-item" onclick="loadEmail(4)">
      <div class="nav-item-header">
        <span class="nav-item-title">5. Submitted — Awaiting Partner</span>
        <span class="recipient-tag tag-owner">Submitter</span>
      </div>
      <span class="nav-item-sub">Confirmation that forms were sent to partner</span>
    </button>
    <button class="nav-item" onclick="loadEmail(5)">
      <div class="nav-item-header">
        <span class="nav-item-title">6. Partner Requested Changes</span>
        <span class="recipient-tag tag-owner">Submitter</span>
      </div>
      <span class="nav-item-sub">Revision feedback when partner disapproves</span>
    </button>

    <div class="stage-title">Stage 4: Mutual Complete & Draft</div>
    <button class="nav-item" onclick="loadEmail(6)">
      <div class="nav-item-header">
        <span class="nav-item-title">7. Mutual Approval Complete</span>
        <span class="recipient-tag tag-mutual">Mutual (Both)</span>
      </div>
      <span class="nav-item-sub">Draft agreement ready & Case Manager notice</span>
    </button>
    <button class="nav-item" onclick="loadEmail(7)">
      <div class="nav-item-header">
        <span class="nav-item-title">8. Case Manager Alert</span>
        <span class="recipient-tag tag-admin">Admin / CM</span>
      </div>
      <span class="nav-item-sub">Admin alert to assign review officer</span>
    </button>
  </div>

  <!-- Preview Pane -->
  <div class="preview-pane">
    <div class="meta-bar">
      <div class="meta-row">
        <span class="meta-label">Subject:</span>
        <span class="meta-value" id="meta-subject">-</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Recipient:</span>
        <span class="meta-value" id="meta-recipient">-</span>
      </div>
      <div class="meta-row">
        <span class="meta-label">Trigger Event:</span>
        <span class="meta-value" id="meta-trigger">-</span>
      </div>
    </div>

    <div class="frame-wrapper" id="frame-wrapper">
      <iframe id="email-frame"></iframe>
    </div>
  </div>
</div>

<script>
  const BRAND_ROSE = '#E28691';
  const BRAND_DARK = '#0F172A';

  function baseTemplate({ eyebrow, icon, heading, body, detailsList, highlightBox, ctaLabel, ctaUrl, footerNote }) {
    const eyebrowHtml = eyebrow
      ? `<table cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto 16px;">
          <tr>
            <td style="background:#FFF1F2;border:1px solid #FFE4E6;border-radius:20px;padding:4px 14px;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:${BRAND_ROSE};">
              ${eyebrow}
            </td>
          </tr>
         </table>`
      : '';

    const iconHtml = icon
      ? `<div style="margin:16px 0 12px;font-size:42px;line-height:1;">${icon}</div>`
      : '';

    let highlightHtml = '';
    if (highlightBox) {
      const styles = {
        info: { bg: '#F0F9FF', border: '#BAE6FD', text: '#0369A1', title: '#0C4A6E' },
        success: { bg: '#F0FDF4', border: '#BBF7D0', text: '#15803D', title: '#14532D' },
        warning: { bg: '#FFFBEB', border: '#FDE68A', text: '#B45309', title: '#78350F' },
        alert: { bg: '#FEF2F2', border: '#FECACA', text: '#B91C1C', title: '#7F1D1D' },
      }[highlightBox.type || 'info'];
      highlightHtml = `
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:20px 0;background:${styles.bg};border:1px solid ${styles.border};border-left:4px solid ${styles.text};border-radius:6px;">
          <tr>
            <td style="padding:14px 18px;text-align:left;">
              ${highlightBox.title ? `<p style="margin:0 0 6px;font-size:13px;font-weight:700;color:${styles.title};">${highlightBox.title}</p>` : ''}
              <p style="margin:0;font-size:13px;line-height:1.6;color:${styles.text};">${highlightBox.content}</p>
            </td>
          </tr>
        </table>
      `;
    }

    let detailsHtml = '';
    if (detailsList && detailsList.length > 0) {
      const rows = detailsList.map(item => `
        <tr>
          <td style="padding:8px 12px;font-size:13px;color:#64748B;border-bottom:1px solid #F1F5F9;font-weight:600;">${item.label}</td>
          <td style="padding:8px 12px;font-size:13px;color:#1E293B;border-bottom:1px solid #F1F5F9;text-align:right;font-weight:700;">${item.value}</td>
        </tr>
      `).join('');
      detailsHtml = `
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:20px 0;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;">
          ${rows}
        </table>
      `;
    }

    const ctaHtml = ctaLabel && ctaUrl
      ? `<table cellpadding="0" cellspacing="0" border="0" align="center" style="margin:28px auto 0;">
          <tr>
            <td align="center" style="border-radius:8px;background:${BRAND_ROSE};">
              <a href="${ctaUrl}" target="_blank"
                 style="display:inline-block;padding:14px 36px;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#FFFFFF;text-decoration:none;border-radius:8px;">
                ${ctaLabel} &rarr;
              </a>
            </td>
          </tr>
        </table>`
      : '';

    const footerNoteHtml = footerNote
      ? `<p style="margin:22px 0 0;font-size:12px;color:#64748B;line-height:1.5;">${footerNote}</p>`
      : '';

    return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>${heading}</title>
</head>
<body style="margin:0;padding:0;background-color:#F8FAFC;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F8FAFC;padding:36px 16px;">
    <tr>
      <td align="center">
        <!-- Logo Header with Company Logo -->
        <table cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto 22px;">
          <tr>
            <td align="center" valign="middle" style="padding-right:12px;">
              <div style="width:40px;height:40px;background:linear-gradient(135deg, #f43f5e 0%, #e28691 100%);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 2px 10px rgba(226,134,145,0.45);">
                💍
              </div>
            </td>
            <td align="center" valign="middle">
              <span style="font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:0.5px;color:${BRAND_DARK};line-height:1;">
                Lets <span style="color:${BRAND_ROSE};">Prenup</span>
              </span>
            </td>
          </tr>
        </table>

        <!-- Card Container -->
        <table width="100%" cellpadding="0" cellspacing="0" border="0"
               style="max-width:560px;background:#ffffff;border:1px solid #F1E5E7;border-radius:14px;padding:42px 36px;text-align:center;box-shadow:0 8px 30px rgba(15,23,42,0.06);">
          <tr>
            <td>
              ${eyebrowHtml}
              ${iconHtml}
              <h1 style="margin:0 0 12px;font-size:24px;font-weight:800;color:${BRAND_DARK};line-height:1.3;">
                ${heading}
              </h1>
              <div style="font-size:14px;color:#1E293B;line-height:1.75;text-align:center;">
                ${body}
              </div>
              ${detailsHtml}
              ${highlightHtml}
              ${ctaHtml}
              ${footerNoteHtml}
            </td>
          </tr>
        </table>

        <!-- Footer -->
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;margin-top:24px;">
          <tr>
            <td align="center" style="font-size:12px;color:#64748B;line-height:1.6;padding-bottom:20px;">
              <p style="margin:0 0 6px;">&copy; ${new Date().getFullYear()} <strong>Lets Prenup</strong>. All rights reserved.</p>
              <p style="margin:0;font-size:11px;color:#94A3B8;">
                This is an automated notification regarding your prenuptial agreement on Lets Prenup.<br/>
                If you have questions, please reach out to our team at support@letsprenup.com
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>`;
  }

  const emails = [
    {
      title: "1. Partner Invitation",
      recipient: "Partner (Sarah Jenkins - sarah@example.com)",
      trigger: "Owner sends invite via Case Dashboard",
      subject: "You have been invited to Lets Prenup by James Miller",
      html: baseTemplate({
        eyebrow: "Partner Invitation",
        heading: "Join Lets Prenup Together",
        icon: "💍",
        body: `<strong>James Miller</strong> has invited you to collaborate on preparing your prenuptial agreement on Lets Prenup.<br/><br/>
               Anticipated Wedding Date: <strong>14 September 2027</strong>.<br/><br/>
               <div style="background:#FFF1F2;border-left:4px solid #E28691;padding:12px 16px;margin:16px 0;font-style:italic;color:#881337;text-align:left;">
                &ldquo;Hey Sarah, I've started our prenuptial process so we can protect our future and agree on terms peacefully.&rdquo;
               </div>
               Lets Prenup provides a guided, secure, and collaborative process for you both to share your details and agree on terms transparently.`,
        ctaLabel: "Accept Invitation & Start",
        ctaUrl: "https://letsprenup.com/register-partner",
        footerNote: "If you were not expecting this invitation, you can safely ignore this email.",
      })
    },
    {
      title: "2. Partner Joined Alert",
      recipient: "Owner (James Miller - james@example.com)",
      trigger: "Partner registers and accepts invite",
      subject: "Great news! Sarah has joined your Lets Prenup case",
      html: baseTemplate({
        eyebrow: "Partner Joined",
        heading: "Sarah Is Now Onboard!",
        icon: "🎉",
        body: `Hello James,<br/><br/>
               Great news! Your partner, <strong>Sarah Jenkins</strong>, has successfully accepted your invitation and created their account on Lets Prenup.<br/><br/>
               Both of you can now access your individual questionnaire sections and begin entering your financial and personal details.`,
        highlightBox: {
          title: "Next Step: Complete Your Questionnaire",
          content: "Fill out your respective sections. Once both of you complete the forms, you will be able to review each other's entries together before final submission.",
          type: "info"
        },
        ctaLabel: "Go To Dashboard",
        ctaUrl: "https://letsprenup.com/dashboard",
      })
    },
    {
      title: "3. Partner Reminder",
      recipient: "Partner (Sarah Jenkins - sarah@example.com)",
      trigger: "Automated / Manual reminder to complete questionnaire",
      subject: "Reminder: Continue your questionnaire on Lets Prenup",
      html: baseTemplate({
        eyebrow: "Gentle Reminder",
        heading: "Your Questionnaire Is Waiting",
        icon: "⏳",
        body: `Hello Sarah,<br/><br/>
               Just a friendly reminder that <strong>James Miller</strong> is waiting for you to complete your questionnaire sections on Lets Prenup.<br/><br/>
               Completing your responses will allow both of you to review your joint information and move forward with creating your prenuptial agreement draft.`,
        ctaLabel: "Continue Questionnaire",
        ctaUrl: "https://letsprenup.com/dashboard/questionnaire",
        footerNote: "Need assistance? You can save your progress and return at any time.",
      })
    },
    {
      title: "4. Handshake Review Request",
      recipient: "Reviewing Partner (Sarah Jenkins - sarah@example.com)",
      trigger: "James clicks 'Submit for Partner Review' in Handshake",
      subject: "Action Required: Review & Approve Agreement Forms — Case #CASE-2026-081",
      html: baseTemplate({
        eyebrow: "Action Required",
        heading: "Forms Ready for Your Review",
        icon: "🤝",
        body: `Hello Sarah,<br/><br/>
               <strong>James Miller</strong> has finalized and submitted their questionnaire details for <strong>Case #CASE-2026-081</strong>.<br/><br/>
               This is the <strong>Handshake Review stage</strong>: Please log in to review both individual and joint responses. If everything looks accurate, give your approval to finalize and lock the forms.`,
        detailsList: [
          { label: "Case Number", value: "CASE-2026-081" },
          { label: "Submitted By", value: "James Miller" },
          { label: "Current Status", value: "Pending Your Review & Approval" },
        ],
        highlightBox: {
          title: "How It Works",
          content: "Carefully check the asset, income, and debt disclosures. If adjustments are needed, you can request changes. Once approved by you, the answers will be locked and your draft agreement will be generated.",
          type: "info"
        },
        ctaLabel: "Review & Approve Forms",
        ctaUrl: "https://letsprenup.com/dashboard/review-approval",
      })
    },
    {
      title: "5. Submission Pending Partner",
      recipient: "Submitter (James Miller - james@example.com)",
      trigger: "James submits questionnaire for Sarah's review",
      subject: "Forms Submitted for Partner Review — Case #CASE-2026-081",
      html: baseTemplate({
        eyebrow: "Under Review",
        heading: "Forms Submitted Successfully!",
        icon: "📬",
        body: `Hello James,<br/><br/>
               Thank you for finalizing your responses for <strong>Case #CASE-2026-081</strong>.<br/><br/>
               We have notified <strong>Sarah Jenkins</strong> that your forms are ready for review. Once they review and confirm the details, the mutual handshake will be complete and your agreement draft will be prepared.`,
        detailsList: [
          { label: "Case Number", value: "CASE-2026-081" },
          { label: "Awaiting Review From", value: "Sarah Jenkins" },
        ],
        ctaLabel: "View Case Status",
        ctaUrl: "https://letsprenup.com/dashboard",
      })
    },
    {
      title: "6. Partner Requested Changes",
      recipient: "Submitter (James Miller - james@example.com)",
      trigger: "Sarah rejects/disapproves with reason in Handshake",
      subject: "Updates Requested on Your Questionnaire — Case #CASE-2026-081",
      html: baseTemplate({
        eyebrow: "Changes Requested",
        heading: "Adjustments Requested by Partner",
        icon: "📝",
        body: `Hello James,<br/><br/>
               Your partner, <strong>Sarah Jenkins</strong>, has reviewed the questionnaire for <strong>Case #CASE-2026-081</strong> and requested some adjustments before final approval.`,
        highlightBox: {
          title: "Partner Feedback",
          content: "&ldquo;Please check the joint property valuation in Section 3; I believe the mortgage balance should be updated with the latest statement.&rdquo;",
          type: "warning"
        },
        ctaLabel: "Review & Update Forms",
        ctaUrl: "https://letsprenup.com/dashboard/joint-liabilities-debts",
        footerNote: "Once you update the necessary fields, you can resubmit them for your partner’s approval.",
      })
    },
    {
      title: "7. Mutual Approval Complete",
      recipient: "MUTUAL EMAIL: Sent to BOTH James & Sarah",
      trigger: "Reviewing partner clicks 'Approve' (Handshake Complete)",
      subject: "Mutual Approval Complete — Draft Agreement Generated! Case #CASE-2026-081",
      html: baseTemplate({
        eyebrow: "Handshake Complete",
        heading: "Congratulations! Handshake Completed",
        icon: "✨",
        body: `Hello James,<br/><br/>
               Both you and <strong>Sarah Jenkins</strong> have officially reviewed and approved your respective questionnaire responses for <strong>Case #CASE-2026-081</strong>.<br/><br/>
               Your information has now been frozen, and your initial <strong>draft prenuptial agreement</strong> has been generated successfully.`,
        highlightBox: {
          title: "What Happens Next?",
          content: "A dedicated <strong>Case Manager</strong> is being assigned to your case right now. They will review your submitted agreement and reach out to both of you within <strong>1–2 business days</strong> to guide you through legal review and lawyer allocation.",
          type: "success"
        },
        detailsList: [
          { label: "Case Number", value: "CASE-2026-081" },
          { label: "Partners", value: "James Miller & Sarah Jenkins" },

  let currentIdx = 0;

  function loadEmail(idx) {
    currentIdx = idx;
    const item = emails[idx];

    document.querySelectorAll('.nav-item').forEach((el, i) => {
      el.classList.toggle('active', i === idx);
    });

    document.getElementById('meta-subject').textContent = item.subject;
    document.getElementById('meta-recipient').textContent = item.recipient;
    document.getElementById('meta-trigger').textContent = item.trigger;

    const frame = document.getElementById('email-frame');
    frame.srcdoc = item.html;
  }

  function setViewMode(mode) {
    const wrapper = document.getElementById('frame-wrapper');
    document.querySelectorAll('.btn-view').forEach(btn => btn.classList.remove('active'));

    if (mode === 'mobile') {
      wrapper.classList.add('mobile');
      event.target.classList.add('active');
    } else {
      wrapper.classList.remove('mobile');
      event.target.classList.add('active');
    }
  }

  loadEmail(0);
